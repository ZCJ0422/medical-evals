name: Run medical evals checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[full]"
        python -m pip install -e "backend[test]"

    - name: Run Python tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test' }}
      run: |
        PYTHONPATH=.:backend python -m pytest -q

    - name: Run mypy
      run: MYPYPATH=backend mypy --config-file=mypy.ini --no-site-packages .

  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Typecheck frontend
      working-directory: frontend
      run: npm run typecheck

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install uv
      run: python -m pip install uv

    - name: Install backend E2E environment
      run: uv sync --directory backend --extra test

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Chromium
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Run browser regression tests
      working-directory: frontend
      run: npm run test:e2e -- --reporter=line
