[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-evals-api"
version = "0.1.0"
description = "Internal API and worker services for the medical-evals workbench"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "SQLAlchemy>=2.0,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=43,<46",
    "openai>=1.0.0",
    "medical-evals",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires MEDICAL_EVALS_TEST_POSTGRES_URL and a disposable PostgreSQL database"]

[tool.setuptools.packages.find]
include = ["medical_evals_api*"]

[tool.uv.sources]
medical-evals = { path = "..", editable = true }
