[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-evals"
version = "3.0.1.post1"
description = "Medical LLM Evaluation Framework based on OpenAI Evals"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "evals @ git+https://github.com/openai/evals.git@8eac7a7de5215c907fbddc30efdaf316913eccdd",
    "aiolimiter",
    "anthropic",
    "backoff",
    "beartype>=0.12.0",
    "blobfile",
    "chess",
    "dacite",
    "datasets",
    "docker",
    "evaluate",
    "filelock",
    "fire",
    "flask",
    "google-generativeai",
    "gymnasium",
    "jiwer",
    "langchain",
    "langdetect",
    "lz4",
    "matplotlib",
    "mock",
    "mypy",
    "networkx",
    "nltk",
    "numexpr",
    "numpy",
    "openai>=1.0.0",
    "pandas",
    "playwright",
    "pydantic",
    "pytest",
    "pyyaml",
    "sacrebleu",
    "seaborn",
    "snowflake-connector-python[pandas]",
    "spacy-universal-sentence-encoder",
    "statsmodels",
    "termcolor",
    "tiktoken",
    "tqdm",
    "types-PyYAML",
    "types-tqdm",
    "zstandard",
]

[project.optional-dependencies]
formatters = ["black", "isort", "autoflake", "ruff"]

torch = ["torch"]

[project.scripts]
oaieval = "evals.cli.oaieval:main"
oaievalset = "evals.cli.oaievalset:main"

[tool.setuptools.packages.find]
include = ["medical_evals*"]

[tool.ruff]
# Allow lines to be as long as 767 characters, this is currently the longest line
# TODO: This should be brought down in the future
line-length = 767

[tool.pytest.ini_options]
# Keep normal *_test.py files while excluding macOS AppleDouble sidecars such
# as ._makemepay_test.py from test discovery.
python_files = ["test_*.py", "[!.]*_test.py"]
