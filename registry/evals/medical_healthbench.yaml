medical-healthbench:
  id: medical-healthbench.smoke.v1
  description: Open-ended medical QA scored against HealthBench rubrics
  metrics: [overall_score]

medical-healthbench.smoke.v1:
  class: medical_evals.evals.healthbench:HealthBenchEval
  args:
    samples_jsonl: medical_healthbench/smoke.jsonl
    judge_completion_fn: medical-openai-compatible
    temperature: 0.1
    max_tokens: 1024
    judge_temperature: 0.0
    judge_max_tokens: 256

medical-healthbench.oss.v1:
  class: medical_evals.evals.healthbench:HealthBenchEval
  args:
    samples_jsonl: ../../../../dataset/HealthBench/2025-05-07-06-14-12_oss_eval.jsonl
    judge_completion_fn: medical-openai-compatible
    temperature: 0.1
    max_tokens: 1024
    judge_temperature: 0.0
    judge_max_tokens: 256

